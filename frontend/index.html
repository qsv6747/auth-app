<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:4000 https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>Auth App</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        var redirect = new URLSearchParams(window.location.search).get("redirect");
        if (redirect) {
          history.replaceState(
            null,
            "",
            window.location.pathname.replace(/\/$/, "") + "/" + redirect
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
